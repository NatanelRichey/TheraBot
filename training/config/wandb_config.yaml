# Weights & Biases Configuration
# For monitoring progressive multi-length training
# Reference: https://docs.wandb.ai/

# Project Configuration
project:
  name: "TheraBot"  # Matches your W&B project
  entity: "natanelrichey_therabot"  # Your W&B username/team
  tags: ["therapy", "dbt", "llama-3.1", "lora", "progressive-training"]

# Run Configuration
run:
  # Progressive run naming
  name_template: "therapy-bot-run{run_number}-{conversation_length}"
  notes_template: "Progressive training run {run_number}: {description}"
  
  # Run-specific configurations
  runs:
    run1:
      name: "therapy-bot-run1-short"
      notes: "Run 1: Short exchanges (2-10 exchanges) - Initial training"
      tags: ["run1", "short", "initial"]
      
    run2:
      name: "therapy-bot-run2-medium"
      notes: "Run 2: Medium exchanges (6-15 exchanges) - Building on Run 1"
      tags: ["run2", "medium", "progressive"]
      
    run3:
      name: "therapy-bot-run3-long"
      notes: "Run 3: Long exchanges (12-20 exchanges) - Final training"
      tags: ["run3", "long", "final"]

# Logging Configuration
logging:
  # Metrics to track
  metrics:
    - "train/loss"
    - "train/learning_rate"
    - "train/grad_norm"
    - "eval/loss"
    - "eval/perplexity"
    - "eval/empathy_score"
    - "eval/safety_score"
    - "eval/dbt_skill_usage"
    - "eval/context_adaptation"
  
  # System metrics
  system_metrics:
    - "system/gpu_memory_used"
    - "system/gpu_memory_total"
    - "system/cpu_percent"
    - "system/ram_used"
  
  # Logging intervals
  log_interval: 10  # Log every 10 steps
  save_interval: 100  # Save checkpoints every 100 steps
  
  # Sample generation
  generate_samples:
    enabled: true
    interval: 500  # Generate samples every 500 steps
    num_samples: 3
    max_length: 200

# Artifacts Configuration
artifacts:
  # Model checkpoints
  checkpoints:
    enabled: true
    save_best: true
    save_last: true
    max_checkpoints: 5
    
  # Sample outputs
  samples:
    enabled: true
    format: "table"
    include_metrics: true
    
  # Training curves
  plots:
    enabled: true
    metrics: ["loss", "learning_rate", "empathy_score"]

# Privacy and Security
privacy:
  # Data privacy settings
  anonymize_data: true
  exclude_sensitive_patterns: true
  
  # Sensitive patterns to exclude from logging
  sensitive_patterns:
    - "suicide"
    - "self-harm"
    - "kill myself"
    - "hurt myself"
    - "end it all"
  
  # Public/private settings
  public: false  # Keep runs private during development
  anonymous: false  # Use your account for better organization

# Integration Settings
integration:
  # HuggingFace Hub integration
  huggingface:
    enabled: true
    auto_push: false  # Manual control for privacy
    
  # Google Drive integration
  google_drive:
    enabled: true
    backup_checkpoints: true
    
  # TensorBoard integration
  tensorboard:
    enabled: true
    sync: true

# Alert Configuration
alerts:
  # Training alerts
  training:
    loss_spike_threshold: 2.0  # Alert if loss increases by 2x
    memory_usage_threshold: 0.9  # Alert at 90% GPU memory
    
  # Safety alerts
  safety:
    harmful_content_detected: true
    crisis_keywords_detected: true
    
  # Performance alerts
  performance:
    slow_training_threshold: 300  # Alert if >5min per step
    convergence_stall_threshold: 1000  # Alert if no improvement for 1000 steps
